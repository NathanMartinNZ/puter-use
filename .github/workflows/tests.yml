name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest

  helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift build -c release --package-path helper
