[project]
name = "puter-use"
version = "1.0.1"
description = "Background computer use for macOS: an agent gets its own cursor and operates app windows without touching yours."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "NathanMartinNZ" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.0",
    "pillow>=12.3.0",
]

[project.urls]
Repository = "https://github.com/NathanMartinNZ/puter-use"

[project.scripts]
puter-use = "puter_use.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
